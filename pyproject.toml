[project]
name = "trashloop-backend"
version = "0.1.0"
description = "AI Trash-Loop orchestration API"
requires-python = ">=3.11"
# The analysis engine (package `trashloop`) is installed separately: either
#   pip install -e ../ai-trash-loop-engine
# or pip install "trashloop @ git+https://github.com/ai-trash-loop/ai-trash-loop-engine.git"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2",
  "pydantic>=2",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
