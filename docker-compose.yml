services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: trashloop
      POSTGRES_PASSWORD: trashloop
      POSTGRES_DB: trashloop
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trashloop"]
      interval: 3s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://trashloop:trashloop@db:5432/trashloop
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  pgdata:
